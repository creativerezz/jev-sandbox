[project]
name = "jev-sandbox"
version = "0.1.0"
description = "Sandbox for TypeSafe Jev System One calls"
authors = [
    { name = "reza", email = "jafar.reza@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
jev-sandbox = "jev_sandbox:main"
jev-eval = "jev_sandbox.evaluate:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
